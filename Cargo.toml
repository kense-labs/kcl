[package]
name = "kense-kcl"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
authors = ["kense-labs"]
license = "MIT"
description = "Parser, generator, schema admission, and canonical digests for KCL (Kense Configuration Language)"
repository = "https://github.com/kense-labs/kcl"
homepage = "https://github.com/kense-labs/kcl"
documentation = "https://docs.rs/kense-kcl"
readme = "README.md"
keywords = ["config", "parser", "kcl", "schema", "kense"]
categories = ["parsing", "config", "encoding"]
include = [
    "/src/**",
    "/tests/**",
    "/fixtures/**",
    "/examples/**",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/Cargo.toml",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "kcl"
path = "src/lib.rs"

[dependencies]
ryu-js = "1.0.3"
sha2 = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "parse_generate"
path = "examples/parse_generate.rs"
